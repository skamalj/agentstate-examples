" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">your call</text><polyline points="240,340 300,340" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><rect x="300" y="312" width="160" height="56" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="380.0" y="337.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">KVHistoryStore.save</text><text x="380.0" y="352.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">surviving</text><text x="20" y="366" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280" font-style="italic">you call reduce just</text><text x="20" y="378" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280" font-style="italic">before the save</text><polyline points="185,360 185,382 478,382" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="193" y="379" text-anchor="start" font-size="10" font-weight="normal" fill="#F28C28">pruned</text><rect x="480" y="332" width="180" height="56" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="570.0" y="357.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">harness notebook</text><text x="570.0" y="372.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">append_memory(pruned.md)</text><text x="20" y="424" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">* the session store keeps the full history unless a conversation manager is configured; only agent.messages is trimmed</text></svg>