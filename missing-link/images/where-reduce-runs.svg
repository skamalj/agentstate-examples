<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" aria-label="Four lanes. In LangGraph and CrewAI the reducer runs inside the framework's save call and writes the surviving messages. In Strands and PydanticAI you call reduce yourself just before the save. In all four the pruned messages go to the on_prune hook and on to that framework's long-term memory." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="436" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="20" y="24" text-anchor="start" font-size="11" font-weight="bold" fill="#1F2937">Framework</text><text x="130" y="24" text-anchor="start" font-size="11" font-weight="bold" fill="#1F2937">Save path</text><text x="480" y="24" text-anchor="start" font-size="11" font-weight="bold" fill="#0E9C7C">on_prune → long-term memory (user)</text><line x1="20" y1="126" x2="660" y2="126" stroke="#F3F4F6"/><text x="20" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#1F2937">LangGraph</text><text x="20" y="77" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">graph.invoke</text><rect x="130" y="42" width="330" height="56" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><text x="295.0" y="74.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1F2937"></text><text x="295" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#2F6FED">ReducingSaver.put  /  checkpointer.put</text><rect x="140" y="66" width="110" height="26" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="195.0" y="83.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">reduce()</text><polyline points="250,79 300,79" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><rect x="300" y="66" width="150" height="26" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="375.0" y="83.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1F2937">write surviving</text><text x="20" y="96" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED" font-style="italic">reduce runs inside</text><text x="20" y="108" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED" font-style="italic">the framework's save</text><polyline points="195,92 195,112 478,112" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="203" y="109" text-anchor="start" font-size="10" font-weight="normal" fill="#F28C28">pruned</text><rect x="480" y="62" width="180" height="56" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="570.0" y="87.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">langgraph-memory</text><text x="570.0" y="102.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">engine.on_prune → BaseStore</text><line x1="20" y1="216" x2="660" y2="216" stroke="#F3F4F6"/><text x="20" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#1F2937">CrewAI</text><text x="20" y="167" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">flow.kickoff</text><rect x="130" y="132" width="330" height="56" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><text x="295.0" y="164.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1F2937"></text><text x="295" y="147" text-anchor="middle" font-size="10" font-weight="bold" fill="#2F6FED">@persist  save_state</text><rect x="140" y="156" width="110" height="26" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="195.0" y="173.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">reduce()</text><polyline points="250,169 300,169" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><rect x="300" y="156" width="150" height="26" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="375.0" y="173.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1F2937">write surviving</text><text x="20" y="186" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED" font-style="italic">reduce runs inside</text><text x="20" y="198" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED" font-style="italic">the framework's save</text><polyline points="195,182 195,202 478,202" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="203" y="199" text-anchor="start" font-size="10" font-weight="normal" fill="#F28C28">pruned</text><rect x="480" y="152" width="180" height="56" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="570.0" y="177.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">CrewAI Memory</text><text x="570.0" y="192.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">remember(scope=namespace)</text><line x1="20" y1="306" x2="660" y2="306" stroke="#F3F4F6"/><text x="20" y="242" text-anchor="start" font-size="12" font-weight="bold" fill="#1F2937">Strands</text><text x="20" y="257" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">agent(turn)</text><rect x="130" y="230" width="110" height="40" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="185.0" y="247.0" text-anchor