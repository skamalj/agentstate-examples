<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="Left: an agent saves its thread to a checkpointer and, separately, your own code must decide what goes to the long-term store; messages pruned from the window are forgotten. Right: the reducer runs inside the save, and the pruned messages go once each to an on_prune hook that feeds the long-term store under a user namespace." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="165" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Today: two pipes, no joint</text><rect x="105" y="40" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="165.0" y="59.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Agent turn</text><rect x="30" y="100" width="270" height="90" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><text x="165.0" y="149.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1F2937"></text><text x="165" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F6FED">Checkpointer / session / flow state</text><text x="165" y="132" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">short-term · keyed by thread</text><rect x="55" y="150" width="14" height="14" rx="2" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.2"/><rect x="73" y="150" width="14" height="14" rx="2" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.2"/><rect x="91" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="109" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="127" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="145" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="163" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="181" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="89" y="146" width="112" height="22" rx="3" fill="none" stroke="#2F6FED" stroke-dasharray="3 3"/><text x="201" y="182" text-anchor="end" font-size="10" font-weight="normal" fill="#2F6FED">window ≤ max_messages</text><text x="72" y="145" text-anchor="middle" font-size="10" font-weight="normal" fill="#F28C28">pruned</text><polyline points="165,72 165,98" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><text x="172" y="88" text-anchor="start" font-size="11" font-weight="normal" fill="#2F6FED">save</text><rect x="30" y="280" width="270" height="44" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="165.0" y="299.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Long-term memory store</text><text x="165.0" y="314.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">keyed by user, tenant, account</text><polyline points="72,190 72,235" fill="none" stroke="#F28C28" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ao)"/><text x="72" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#F28C28">✕ forgotten</text><text x="72" y="266" text-anchor="middle" font-size="10" font-weight="normal" fill="#F28C28">nothing fires</text><polyline points="227,55 315,55 315,302 302,302" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="310" y="200" text-anchor="end" font-size="11" font-weight="bold" fill="#6B7280">your code</text><text x="310" y="214" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">when? which?</text><text x="310" y="227" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">what if it fails?</text><line x1="340" y1="20" x2="340" y2="330" stroke="#E5E7EB"/><text x="505" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">With agentstate-reducer: the joint</text><rect x="445" y="40" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="505.0" y="59.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Agent turn</text><rect x="370" y="100" width="270" height="90" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><text x="505.0" y="149.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1F2937"></text><text x="505" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F6FED">Checkpointer / session / flow state</text><text x="505" y="132" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">short-term · keyed by thread</text><rect x="395" y="150" width="14" height="14" rx="2" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.2"/><rect x="413" y="150" width="14" height="14" rx="2" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.2"/><rect x="431" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="449" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.2"/><rect x="467" y="150" width="14" height="14" rx="2" fill="#E4ECFD" stroke