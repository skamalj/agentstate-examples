<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="At turn 9 the morning-departure preference becomes memory f7cea1b4. At turn 21 the correction is extracted as a candidate fact with cosine similarity 0.46 to that memory. With the consolidation threshold at 0.4 the engine updates the same record; with the default 0.85 it would insert a second, conflicting record." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="20" y="30" width="200" height="44" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="120.0" y="49.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">turn 4 (pruned at turn 9)</text><text x="120.0" y="64.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">“I strongly prefer morning departures”</text><polyline points="220,52 258,52" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="239" y="46" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#0E9C7C">extract</text><rect x="260" y="30" width="160" height="44" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="340.0" y="49.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">memory [f7cea1b4]</text><text x="340.0" y="64.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">prefers morning departures</text><rect x="20" y="100" width="200" height="44" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="120.0" y="119.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">turn 17 (pruned at turn 21)</text><text x="120.0" y="134.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">“scrap morning flights, book overnight”</text><polyline points="220,122 258,122" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="239" y="116" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#0E9C7C">extract</text><rect x="260" y="100" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="340.0" y="119.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">candidate fact</text><text x="340.0" y="134.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">prefers overnight flights</text><polyline points="340,74 340,98" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="348" y="90" text-anchor="start" font-size="10" font-weight="bold" fill="#1F2937">cosine similarity (Titan v2) = 0.46</text><polyline points="420,122 460,122 460,210 483,210" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><polyline points="420,122 460,122 460,316 483,316" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/><text x="485" y="172" text-anchor="start" font-size="11" font-weight="bold" fill="#0E9C7C">consolidation_threshold = 0.4</text><text x="485" y="185" text-anchor="start" font-size="10" font-weight="normal" fill="#0E9C7C">0.46 ≥ 0.4 → treated as the same memory</text><rect x="485" y="192" width="175" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="572.5" y="209.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">UPDATE [f7cea1b4]</text><text x="572.5" y="224.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">one record: now overnight</text><text x="485" y="246" text-anchor="start" font-size="10" font-weight="normal" fill="#0E9C7C">28 memories after 30 turns</text><text x="485" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#6B7280">default threshold = 0.85</text><text x="485" y="291" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">0.46 &lt; 0.85 → looks unrelated, so insert</text><rect x="485" y="298" width="175" height="22" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="572.5" y="313.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">[f7cea1b4] morning</text><rect x="485" y="324" width="175" height="22" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="572.5" y="339.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">[new id] overnight</text><text x="660" y="356" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">two conflicting records · 53 memories</text><text x="20" y="190" text-anchor="start" font-size="10" font-weight="normal" fill="#1F2937">Consolidation: search the store for similar</text><text x="20" y="204" text-anchor="start" font-size="10" font-weight="normal" fill="#1F2937">memories, then let the consolidator decide.</text><text x="20" y="226" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">The threshold is a property of the</text><text x="20" y="240" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">embedding model, not of the engine:</text><text x="20" y="258" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">0.46   the two flight-preference phrasings</text><text x="20" y="272" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">0.72   two paraphrases of “trip to Japan”</text><text x="20" y="286" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">0.06 – 0.23   unrelated facts</text></svg>