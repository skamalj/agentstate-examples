<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" width="680" height="364" role="img" aria-label="Thread A: the agent saves through ReducingSaver; 54 pruned messages go once each to the on_prune hook, which extracts and consolidates into an indexed store under the namespace for the user asha. Thread B starts with an empty saver; a recall node queries the same namespace and puts the matches in the system prompt. The threads share only the namespace." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="364" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="20" y="26" text-anchor="start" font-size="13" font-weight="bold" fill="#1F2937">Thread A · 30 turns</text><rect x="20" y="40" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="75.0" y="57.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">agent</text><text x="75.0" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">Claude Sonnet 4.6</text><polyline points="130,60 168,60" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><text x="149" y="54" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">save</text><rect x="170" y="40" width="190" height="40" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="265.0" y="57.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">ReducingSaver</text><text x="265.0" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">InMemorySaver A · 6 messages</text><polyline points="265,80 265,112" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="272" y="100" text-anchor="start" font-size="10" font-weight="normal" fill="#F28C28">54 pruned, once each</text><rect x="170" y="114" width="190" height="30" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="265.0" y="133.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">on_prune → engine.remember</text><polyline points="360,129 380,129 380,165 398,165" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="376" y="156" text-anchor="end" font-size="9.5" font-weight="normal" fill="#0E9C7C">extract · consolidate</text><rect x="400" y="150" width="260" height="60" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="530.0" y="177.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">InMemoryStore (indexed)</text><text x="530.0" y="192.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">namespace ('memories', 'asha') · 28 memories</text><text x="530" y="226" text-anchor="middle" font-size="10" font-weight="normal" fill="#0E9C7C" font-style="italic">keyed by the user, not by the thread</text><polyline points="95,262 95,185 398,185" fill="none" stroke="#0E9C7C" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/><text x="102" y="178" text-anchor="start" font-size="9.5" font-weight="normal" fill="#0E9C7C">query: “what flight timing did I settle on, and who is coming?”</text><polyline points="400,200 55,200 55,262" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="102" y="214" text-anchor="start" font-size="9.5" font-weight="normal" fill="#0E9C7C">top hit: overnight (was morning) · Meera in the list</text><rect x="16" y="230" width="150" height="18" fill="#FFFFFF" opacity="0.9"/><text x="20" y="244" text-anchor="start" font-size="13" font-weight="bold" fill="#1F2937">Thread B · fresh</text><rect x="20" y="264" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="95.0" y="281.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">recall node</text><text x="95.0" y="296.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">engine.recall(q, asha, 8)</text><polyline points="170,284 198,284" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/><text x="184" y="318" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">→ system prompt</text><rect x="200" y="264" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="270.0" y="281.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">agent</text><text x="270.0" y="296.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">same 2-sentence prompt</text><polyline points="340,284 368,284" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><rect x="370" y="264" width="70" height="40" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="405.0" y="281.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">saver B</text><text x="405.0" y="296.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">empty</text><text x="20" y="336" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">Thread B's saver has no entry for thread A; the two share nothing but the namespace.</text><text x="20" y="350" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">The create_agent variant swaps the recall node for a search_memory tool; same store, same records.</text></svg>