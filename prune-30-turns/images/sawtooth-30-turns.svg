<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-label="A sawtooth: the checkpoint grows by two messages a turn, hits twelve at turns 6, 9, 12 and every third turn after, and is pruned back to six each time. Each prune sends six messages down to the long-term memory namespace for the user asha. Turn 9 stores the morning-departure preference; turn 21 updates it with the correction from turn 17." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="348" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="340" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Messages in the checkpoint after each turn (max 10, prune to 6)</text><line x1="60" y1="224" x2="650" y2="224" stroke="#6B7280"/><line x1="60" y1="84" x2="60" y2="224" stroke="#6B7280"/><text x="52" y="228.0" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">0</text><text x="52" y="158.0" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">6</text><text x="52" y="111.33333333333333" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">10</text><text x="52" y="88.0" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">12</text><text x="79.66666666666667" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">1</text><text x="158.33333333333331" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">5</text><text x="256.66666666666663" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">10</text><text x="355.0" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">15</text><text x="453.3333333333333" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">20</text><text x="551.6666666666667" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">25</text><text x="650.0" y="238" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">30</text><text x="52" y="238" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280">turn</text><line x1="60" y1="107.33333333333333" x2="650" y2="107.33333333333333" stroke="#2F6FED" stroke-dasharray="4 3"/><line x1="60" y1="154.0" x2="650" y2="154.0" stroke="#2F6FED" stroke-dasharray="4 3"/><line x1="178.0" y1="84.0" x2="178.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="237.0" y1="84.0" x2="237.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="296.0" y1="84.0" x2="296.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="355.0" y1="84.0" x2="355.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="414.0" y1="84.0" x2="414.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="473.0" y1="84.0" x2="473.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="532.0" y1="84.0" x2="532.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="591.0" y1="84.0" x2="591.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><line x1="650.0" y1="84.0" x2="650.0" y2="154.0" stroke="#F28C28" stroke-width="2.5"/><polyline points="60.0,224.0 79.7,200.7 99.3,177.3 119.0,154.0 138.7,130.7 158.3,107.3 178.0,84.0 178.0,154.0 197.7,130.7 217.3,107.3 237.0,84.0 237.0,154.0 25