2" stroke-dasharray="3 3" marker-end="url(#ao)"/><rect x="302.0" y="93.33333333333333" width="210" height="15" fill="#FFFFFF" opacity="0.9"/><text x="304.0" y="104.33333333333333" text-anchor="start" font-size="10" font-weight="normal" fill="#2F6FED">max_messages = 10 (prune when exceeded)</text><rect x="302.0" y="157.0" width="232" height="15" fill="#FFFFFF" opacity="0.9"/><text x="304.0" y="168.0" text-anchor="start" font-size="10" font-weight="normal" fill="#2F6FED">min_messages = 6 · lower bound, what survives</text><rect x="60" y="266" width="590" height="44" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="355.0" y="285.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Long-term memory · namespace = ('memories', 'asha')</text><text x="355.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">each prune hands 6 turns to on_prune, once each · 9 prunes × 6 = 54 delivered · 28 memories after turn 30</text><line x1="237.0" y1="80" x2="237.0" y2="52" stroke="#F28C28" stroke-width="1"/><text x="242.0" y="50" text-anchor="start" font-size="10" font-weight="normal" fill="#F28C28">turn 9: morning-flight preference leaves → NEW memory</text><line x1="473.0" y1="80" x2="473.0" y2="66" stroke="#F28C28" stroke-width="1"/><text x="468.0" y="64" text-anchor="end" font-size="10" font-weight="normal" fill="#F28C28">turn 21: correction leaves → UPDATED memory</text><text x="340" y="334" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">Blue: checkpoint size. Orange drops: the reducer prunes 12 → 6 inside the checkpoint write.</text></svg>