[project]
name = "prune-30-turns"
version = "0.1.0"
description = "We ran the pruner for 30 turns. Here is what the agent remembered. (agentstate-reducer + langgraph-memory demo)"
requires-python = ">=3.12"
dependencies = [
    "agentstate-reducer[langgraph]==0.5.0",
    "boto3>=1.43.101",
    "langchain-aws>=1.7.9",
    "langgraph-memory==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
