<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="One publish_interrupts call fans out to a list of announcers. Shipped: SqsAnnounce, DynamoDbAnnounce and LogAnnounce, used in act 4 and highlighted, plus SnsAnnounce, EventBridgeAnnounce and WebhookAnnounce. Separated and dimmed: Kinesis, Kafka, Slack, a Redis key, a Postgres row, each one BaseAnnounce subclass with a deliver method away, and not shipped." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="20" y="120" width="150" height="60" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="95.0" y="147.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">publish_interrupts(</text><text x="95.0" y="162.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">result, thread_id, announce)</text><text x="95" y="196" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">reads result['__interrupt__']</text><text x="95" y="208" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">and nothing else</text><rect x="200" y="30" width="210" height="270" rx="8" fill="none" stroke="#0E9C7C" stroke-dasharray="5 4"/><text x="305" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0E9C7C">ships in agent-wait 0.7.0</text><rect x="210" y="58" width="190" height="34" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="72.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">SqsAnnounce</text><text x="305.0" y="87.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">FIFO, dedupe_key · used in act 4</text><polyline points="170,150 185,150 185,75 208,75" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="210" y="98" width="190" height="34" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="112.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">DynamoDbAnnounce</text><text x="305.0" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">row, status=open · used in act 4</text><polyline points="170,150 185,150 185,115 208,115" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="210" y="138" width="190" height="34" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="152.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">LogAnnounce</text><text x="305.0" y="167.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">a log line · used in act 4</text><polyline points="170,150 185,150 185,155 208,155" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="210" y="178" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="192.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">SnsAnnounce</text><text x="305.0" y="207.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">tags → message attributes</text><polyline points="170,150 185,150 185,195 208,195" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="210" y="218" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="232.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">EventBridgeAnnounce</text><text x="305.0" y="247.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">a bus, rules fan out</text><polyline points="170,150 185,150 185,235 208,235" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="210" y="258" width="190" height="34" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="305.0" y="272.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">WebhookAnnounce</text><text x="305.0" y="287.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">signed POST, stdlib</text><polyline points="170,150 185,150 185,275 208,275" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#ag)"/><rect x="440" y="30" width="220" height="270" rx="8" fill="none" stroke="#6B7280" stroke-dasharray="5 4"/><text x="550" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6B7280">one method away (not shipped)</text><text x="550" y="60" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#6B7280">class X(BaseAnnounce): def deliver(envelope, transition)</text><rect x="450" y="70" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="550" y="89" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6B7280">Kinesis</text><rect x="450" y="110" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="550" y="129" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6B7280">Kafka</text><rect x="450" y="150" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="550" y="169" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6B7280">Slack</text><rect x="450" y="190" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="550" y="209" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6B7280">Redis key</text><rect x="450" y="230" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="550" y="249" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#6B7280">Postgres row</text><line x1="410" y1="150" x2="448" y2="150" stroke="#6B7280" stroke-dasharray="4 3" opacity="0.6"/><text x="340" y="318" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">Still one publish_interrupts call. A raise inside deliver() becomes a log line; the run completes.</text></svg>