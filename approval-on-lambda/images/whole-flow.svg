<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="End-to-end flow: a start message on the answers queue triggers a Lambda invocation; the agent calls escalate_refund, which parks. The checkpointer writes the parked thread to DynamoDB and publish_interrupts puts the envelope on the questions queue and a row in the approvals table. Then nothing runs for days. Finance reads the envelope, fills in reply_with and sends it to the answers queue, which triggers a second invocation that loads the thread, resumes, and issues the refund once." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><line x1="20" y1="40" x2="660" y2="40" stroke="#E5E7EB"/><line x1="20" y1="150" x2="660" y2="150" stroke="#E5E7EB"/><line x1="20" y1="290" x2="660" y2="290" stroke="#E5E7EB"/><rect x="20" y="60" width="205" height="62" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="122.5" y="88.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">invocation 1 · start</text><text x="122.5" y="103.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">agent → escalate_refund → @wait parks</text><text x="122" y="114" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">run ends with __interrupt__</text><rect x="30" y="172" width="90" height="34" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="75.0" y="186.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">answers.fifo</text><text x="75.0" y="201.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">start message</text><polyline points="75,172 75,124" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="80" y="142" text-anchor="start" font-size="9.5" font-weight="normal" fill="#0E9C7C">triggers</text><polyline points="150,122 150,170" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><text x="155" y="142" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED">DynamoDBSaver</text><rect x="130" y="172" width="110" height="46" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="185.0" y="192.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">checkpoint table</text><text x="185.0" y="207.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">parked thread: 8 items</text><polyline points="200,122 200,132 300,132 300,170" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="305" y="142" text-anchor="start" font-size="9.5" font-weight="normal" fill="#F28C28">publish_interrupts</text><rect x="250" y="172" width="100" height="46" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="300.0" y="192.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">questions.fifo</text><text x="300.0" y="207.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">the envelope</text><rect x="250" y="224" width="100" height="30" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="300.0" y="236.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">approvals table</text><text x="300.0" y="251.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">status = open</text><polyline points="300,218 300,224" fill="none" stroke="#F28C28" stroke-width="1" marker-end="url(#ao)"/><rect x="365" y="60" width="100" height="200" rx="6" fill="none" stroke="#6B7280" stroke-dasharray="5 4"/><text x="415" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B7280">days</text><text x="415" y="166" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">nothing running</text><text x="415" y="180" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">nothing polling</text><text x="415" y="194" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">cost: zero</text><polyline points="350,195 357,195 357,302 378,302" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="380" y="282" width="160" height="40" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="460.0" y="299.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">reads the envelope</text><text x="460.0" y="314.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">copies reply_with, sets answer</text><polyline points="540,302 560,302 560,210" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#a)"/><text x="566" y="262" text-anchor="start" font-size="9.5" font-weight="normal" fill="#7C3AED">approve</text><rect x="510" y="172" width="100" height="34" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="560.0" y="186.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">answers.fifo</text><text x="560.0" y="201.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">answer message</text><polyline points="560,172 560,124" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="566" y="142" text-anchor="start" font-size="9.5" font-weight="normal" fill="#0E9C7C">triggers</text><rect x="465" y="60" width="205" height="62" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="567.5" y="88.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">invocation 2 · answer</text><text x="567.5" y="103.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">resume → escalate_refund runs</text><text x="567" y="114" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">refund issued once · reply sent</text><polyline points="185,218 185,270 500,270 500,122" fill="none" stroke="#2F6FED" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/><text x="140" y="284" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED">thread loaded back from DynamoDB (ConsistentRead)</text><rect x="20" y="44" width="175.4" height="14" fill="#FFFFFF" opacity="0.9"/><text x="22" y="54" text-anchor="start" font-size="10.5" font-weight="bold" fill="#6B7280">Lambda (a process, briefly)</text><rect x="20" y="154" width="206.4" height="14" fill="#FFFFFF" opacity="0.9"/><text x="22" y="164" text-anchor="start" font-size="10.5" font-weight="bold" fill="#0E9C7C">AWS: SQS + DynamoDB (no process)</text><rect x="20" y="294" width="113.4" height="14" fill="#FFFFFF" opacity="0.9"/><text x="22" y="304" text-anchor="start" font-size="10.5" font-weight="bold" fill="#7C3AED">Finance (a human)</text><text x="340" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">Two packages, neither importing the other: langgraph-dynamodb-checkpoint makes the parked thread a row;</text><text x="340" y="354" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">agent-wait makes the interrupt a message. The host is one if: question_id in the message → resume, else start.</text><text x="340" y="370" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">Duplicate or late answers reach invocation 3 and 4, load the thread, find the question answered, and return in tens of milliseconds.</text></svg>