answer</text><text x="20" y="132" text-anchor="start" font-size="9" font-weight="normal" fill="#6B7280">finance approves · model writes the reply</text><rect x="200" y="104" width="449.2" height="30" fill="#E4ECFD" stroke="#2F6FED"/><text x="424.613" y="123" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">run (warm)</text><text x="200" y="100" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">1996.56</text><text x="20" y="168" text-anchor="start" font-size="11" font-weight="bold" fill="#1F2937">3 · duplicate answer</text><text x="20" y="182" text-anchor="start" font-size="9" font-weight="normal" fill="#6B7280">no-op resume · no model call</text><rect x="200" y="154" width="3.3" height="30" fill="#F28C28" stroke="#F28C28"/><text x="211.33675" y="173" text-anchor="start" font-size="9.5" font-weight="bold" fill="#F28C28">14.83</text><text x="20" y="218" text-anchor="start" font-size="11" font-weight="bold" fill="#1F2937">4 · late rejection</text><text x="20" y="232" text-anchor="start" font-size="9" font-weight="normal" fill="#6B7280">no-op resume · no model call</text><rect x="200" y="204" width="4.2" height="30" fill="#F28C28" stroke="#F28C28"/><text x="212.20525" y="223" text-anchor="start" font-size="9.5" font-weight="bold" fill="#F28C28">18.69</text><line x1="200" y1="254" x2="650" y2="254" stroke="#6B7280"/><line x1="200.0" y1="254" x2="200.0" y2="259" stroke="#6B7280"/><text x="200.0" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">0 s</text><line x1="312.5" y1="254" x2="312.5" y2="259" stroke="#6B7280"/><text x="312.5" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">0.5 s</text><line x1="425.0" y1="254" x2="425.0" y2="259" stroke="#6B7280"/><text x="425.0" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">1 s</text><line x1="537.5" y1="254" x2="537.5" y2="259" stroke="#6B7280"/><text x="537.5" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">1.5 s</text><line x1="650.0" y1="254" x2="650.0" y2="259" stroke="#6B7280"/><text x="650.0" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">2 s</text><text x="340" y="294" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">All four were warm: the deadline run went first on the same function. Invocations are days apart; only durations are to scale.</text><text x="340" y="308" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">Max memory 180 MB · 3.5 GB-seconds for the whole approval.</text><text x="340" y="322" text-anchor="middle" font-size="10" font-weight="bold" fill="#F28C28">15 and 19 ms billed is what a no-op resume costs: load the thread, see the question answered, return.</text></svg>