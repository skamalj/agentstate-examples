nt-size="9" font-weight="normal" fill="#6B7280">1.5 s</text><line x1="650.0" y1="254" x2="650.0" y2="259" stroke="#6B7280"/><text x="650.0" y="271" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">2 s</text><text x="340" y="294" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">All four were warm: the timeout run had already started the container. Invocations are days apart; only durations are to scale.</text><text x="340" y="308" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">Max memory 181–182 MB · 3.6 GB-seconds for the whole approval.</text><text x="340" y="322" text-anchor="middle" font-size="10" font-weight="bold" fill="#F28C28">32 and 17 ms billed is what a no-op resume costs: load the thread, see the question answered, return.</text></svg>