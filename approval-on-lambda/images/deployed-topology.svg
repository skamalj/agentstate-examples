<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="The deployed topology: a laptop script puts starts and answers on the answers FIFO queue, which triggers one Lambda running handler.py and graph.py against Bedrock. The function writes the checkpoints table, the approvals table with its by_status index, and the side-effect counter, and publishes the envelope to the questions FIFO queue that finance reads. Failed messages go to a dead-letter queue after three receives." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="20" y="116" width="110" height="52" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="75.0" y="139.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">laptop script</text><text x="75.0" y="154.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">customer, then finance</text><polyline points="130,136 168,136" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><text x="149" y="128" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#0E9C7C">start /</text><text x="149" y="150" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#0E9C7C">answer</text><rect x="170" y="112" width="130" height="48" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="235.0" y="133.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">answers.fifo</text><text x="235.0" y="148.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">group id = thread_id</text><text x="235" y="172" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">batch size 1</text><rect x="170" y="196" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="235.0" y="208.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">dlq.fifo</text><text x="235.0" y="223.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">after 3 receives</text><polyline points="235,160 235,196" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><polyline points="300,136 338,136" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><text x="319" y="128" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2F6FED">triggers</text><rect x="340" y="96" width="140" height="80" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="410.0" y="133.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Lambda · handler.py</text><text x="410.0" y="148.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">py 3.12 · 1 GB · 120 s</text><text x="410" y="166" text-anchor="middle" font-size="9" font-weight="normal" fill="#2F6FED">graph.py + the one if</text><rect x="340" y="30" width="140" height="30" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="410.0" y="49.5" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1F2937">Bedrock · Claude Sonnet 4.6</text><polyline points="410,96 410,62" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/><polyline points="480,116 508,68" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><rect x="510" y="44" width="150" height="44" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="585.0" y="63.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">checkpoints</text><text x="585.0" y="78.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">PK/SK · ttl attr · no GSI</text><polyline points="480,136 508,136" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><rect x="510" y="112" width="150" height="44" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="585.0" y="131.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">approvals</text><text x="585.0" y="146.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">pk/sk · GSI by_status</text><polyline points="480,156 508,204" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><rect x="510" y="180" width="150" height="44" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="585.0" y="199.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">side-effects (counter)</text><text x="585.0" y="214.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">ADD calls :one</text><polyline points="410,176 410,240" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="415" y="212" text-anchor="start" font-size="9" font-weight="normal" fill="#F28C28">SqsAnnounce</text><rect x="340" y="242" width="140" height="48" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="410.0" y="263.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">questions.fifo</text><text x="410.0" y="278.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">dedupe id = dedupe_key</text><polyline points="340,266 75,266 75,170" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="205" y="260" text-anchor="middle" font-size="9" font-weight="normal" fill="#7C3AED">finance reads the envelope</text><text x="340" y="318" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">Two FIFO queues, one function, three tables. No scheduler, no wait store, no sweeper. Torn down with cdk destroy.</text></svg>