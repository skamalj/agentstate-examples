<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-label="The approval on the deployed stack, numbered to match Step 4. 1: the customer's message goes on answers.fifo, invocation 1 runs the graph and parks, the thread is written to the checkpoints table as rows, and publish_interrupts puts the envelope on questions.fifo and an open row in the approvals table. 2: nothing of ours runs; the thread is rows in DynamoDB, the question is a message and a row. 3: finance reads the envelope, copies reply_with, sets answer, and sends it to answers.fifo. 4: invocation 2 loads the thread from the checkpoints table, resumes it, and the refund runs, side-effects counter 1. 5: the same answer arrives twice more, invocations 3 and 4 are no-ops, the counter stays 1. Two FIFO queues, one function, three tables; the approvals row stays open after the refund." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs><rect width="680" height="470" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="340" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">The approval on the deployed stack, in the order of Step 4's five points</text><text x="80" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7C3AED">customer · finance</text><line x1="80" y1="54" x2="80" y2="374" stroke="#E5E7EB"/><text x="220" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0E9C7C">answers.fifo</text><line x1="220" y1="54" x2="220" y2="374" stroke="#E5E7EB"/><text x="360" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2F6FED">Lambda</text><line x1="360" y1="54" x2="360" y2="374" stroke="#E5E7EB"/><text x="545" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#F28C28">DynamoDB tables · questions.fifo</text><line x1="545" y1="54" x2="545" y2="374" stroke="#E5E7EB"/><circle cx="20" cy="86" r="9" fill="#F28C28"/><text x="20" y="89.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">1</text><rect x="36" y="70" width="88" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="80.0" y="84.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">customer</text><text x="80.0" y="97.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">start message</text><polyline points="124,86 176,86" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#mn)"/><rect x="178" y="70" width="84" height="32" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="220.0" y="89.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">answers.fifo</text><polyline points="262,86 316,86" fill="none" stroke="#2F6FED" stroke-width="1.2" marker-end="url(#mb)"/><text x="289" y="82" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2F6FED">triggers</text><rect x="318" y="66" width="84" height="40" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="360.0" y="84.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">invocation 1</text><text x="360.0" y="97.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">graph runs, parks</text><polyline points="402,78 456,78" fill="none" stroke="#2F6FED" stroke-width="1.2" marker-end="url(#mb)"/><rect x="458" y="62" width="200" height="28" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="558.0" y="79.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">checkpoints table</text><text x="558" y="102" text-anchor="middle" font-size="9" font-weight="normal" fill="#2F6FED">the parked thread, as rows</text><polyline points="402,94 430,94 430,132 456,132" fill="none" stroke="#F28C28" stroke-width="1.2" marker-end="url(#mo)"/><text x="436" y="112" text-anchor="start" font-size="8.5" font-weight="normal" fill="#F28C28">publish_interrupts</text><rect x="458" y="118" width="96" height="28" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="506.0" y="135.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">questions.fifo</text><rect x="562" y="118" width="96" height="28" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="610.0" y="135.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">approvals row</text><text x="610" y="158" text-anchor="middle" font-size="9" font-weight="normal" fill="#F28C28">status = open</text><circle cx="20" cy="190" r="9" fill="#F28C28"/><text x="20" y="193.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">2</text><rect x="36" y="172" width="622" height="38" rx="6" fill="none" stroke="#6B7280" stroke-dasharray="5 4"/><text x="347" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280">nothing of ours runs</text><text x="347" y="202" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">the thread is rows in DynamoDB · the question is a message on questions.fifo and a row in the approvals table</text><circle cx="20" cy="252" r="9" fill="#F28C28"/><text x="20" y="255.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">3</text><polyline points="506,224 506,238 128,238 128,248" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ma)"/><text x="320" y="234" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#7C3AED">finance reads the envelope</text><rect x="36" y="250" width="92" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="82.0" y="264.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">finance</text><text x="82.0" y="277.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">copies reply_with</text><text x="82" y="294" text-anchor="middle" font-size="9" font-weight="normal" fill="#7C3AED">sets answer</text><polyline points="128,266 176,266" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#mn)"/><rect x="178" y="250" width="84" height="32" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="220.0" y="269.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">answers.fifo</text><circle cx="20" cy="316" r="9" fill="#F28C28"/><text x="20" y="319.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">4</text><polyline points="220,288 220,316 316,316" fill="none" stroke="#2F6FED" stroke-width="1.2" marker-end="url(#mb)"/><text x="268" y="312" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2F6FED">triggers</text><rect x="318" y="300" width="84" height="32" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="360.0" y="314.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">invocation 2</text><text x="360.0" y="327.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">resumes</text><polyline points="456,308 402,308" fill="none" stroke="#2F6FED" stroke-width="1.2" marker-end="url(#mb)"/><text x="430" y="304" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2F6FED">loads</text><text x="558" y="312" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">checkpoints table → the thread</text><polyline points="402,324 456,324" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#mn)"/><text x="558" y="328" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0E9C7C">the refund runs: side-effects counter = 1</text><circle cx="20" cy="378" r="9" fill="#F28C28"/><text x="20" y="381.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">5</text><rect x="36" y="362" width="92" height="32" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="82.0" y="376.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">same answer</text><text x="82.0" y="389.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">twice more</text><polyline points="128,378 176,378" fill="none" stroke="#0E9C7C" stroke-width="1.2" marker-end="url(#mn)"/><rect x="178" y="362" width="84" height="32" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="220.0" y="381.78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">answers.fifo</text><polyline points="262,378 316,378" fill="none" stroke="#2F6FED" stroke-width="1.2" marker-end="url(#mb)"/><rect x="318" y="362" width="84" height="32" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="360.0" y="376.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">invocations 3, 4</text><text x="360.0" y="389.0" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">no-ops</text><text x="558" y="374" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">the thread has moved past the question</text><text x="558" y="390" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6B7280">counter still 1 · nothing runs</text><text x="340" y="408" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">Two FIFO queues, one function, three tables (checkpoints, approvals, side-effects counter).</text><text x="340" y="424" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">answers.fifo carries starts and answers, told apart by one if; questions.fifo carries the envelope finance reads.</text><text x="340" y="440" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6B7280">The approvals row stays open after the refund: DynamoDbAnnounce writes it once; closing it is the host's job.</text><text x="340" y="458" text-anchor="middle" font-size="10" font-weight="bold" fill="#F28C28">Between the question going out and the answer coming back, nothing runs and the cost is zero.</text></svg>