<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-label="The envelope field by field, in four groups: identity (event_id, thread_id, question_id), the question shaped by @wait, the policy fields that are published but not enforced, and reply_with, a pre-filled reply with answer set to null. Finance copies reply_with, sets the answer, and sends it to the answers queue, where the host's one if turns it into Command(resume)." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="372" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="bold" fill="#1F2937">wait.created envelope, as it landed on questions.fifo</text><rect x="20" y="36" width="440" height="69" rx="6" fill="none" stroke="#6B7280"/><text x="28" y="49" text-anchor="start" font-size="10" font-weight="bold" fill="#6B7280">identity</text><text x="28" y="65" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">event_id</text><text x="205" y="65" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">01M3AA94A3CG2QR8V8X7HV5E10  (ULID)</text><text x="28" y="80" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">thread_id</text><text x="205" y="80" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">order-4471-0db3659a</text><text x="28" y="95" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">question_id</text><text x="205" y="95" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">2a54b510…  (LangGraph's Interrupt.id, stable across republishes)</text><rect x="20" y="113" width="440" height="69" rx="6" fill="none" stroke="#F28C28"/><text x="28" y="126" text-anchor="start" font-size="10" font-weight="bold" fill="#F28C28">the question  (shaped by @wait)</text><text x="28" y="142" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">question.function</text><text x="205" y="142" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">escalate_refund</text><text x="28" y="157" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">question.args</text><text x="205" y="157" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">{order_id: order-4471, amount: 41000}</text><text x="28" y="172" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">source.function</text><text x="205" y="172" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">escalate_refund</text><rect x="20" y="190" width="440" height="99" rx="6" fill="none" stroke="#2F6FED"/><text x="28" y="203" text-anchor="start" font-size="10" font-weight="bold" fill="#2F6FED">the policy  (published, not enforced)</text><text x="28" y="219" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">allowed_actions</text><text x="205" y="219" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">[approve, reject]</text><text x="28" y="234" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">expires_at</text><text x="205" y="234" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">2026-09-27T18:19:10Z  ← advisory</text><text x="28" y="249" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">default</text><text x="205" y="249" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">{action: reject, reason: no finance response within P3D}</text><text x="28" y="264" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">answer_ttl, reply_to, correlation</text><text x="205" y="264" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">null</text><text x="28" y="279" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">tags</text><text x="205" y="279" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">{approver_group: finance}</text><rect x="20" y="297" width="440" height="66" rx="6" fill="#EDE9FE" stroke="#7C3AED"/><text x="28" y="310" text-anchor="start" font-size="10" font-weight="bold" fill="#7C3AED">reply_with  (a pre-filled reply)</text><text x="28" y="326" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">thread_id</text><text x="205" y="326" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">order-4471-0db3659a</text><text x="28" y="341" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">question_id</text><text x="205" y="341" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280">2a54b510…</text><text x="28" y="356" text-anchor="start" font-size="9.5" font-weight="bold" fill="#1F2937">answer</text><text x="205" y="356" text-anchor="start" font-size="9.5" font-weight="bold" fill="#7C3AED">null   ← the only field to fill in</text><polyline points="460,330 478,330" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#a)"/><text x="469" y="323" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#7C3AED">copy</text><rect x="480" y="293" width="180" height="74" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="570.0" y="334.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1F2937"></text><text x="570" y="309" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7C3AED">finance sets answer</text><text x="570" y="325" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">{action: approve}</text><text x="570" y="341" text-anchor="middle" font-size="10" font-weight="normal" fill="#7C3AED">sends it to answers.fifo</text><text x="570" y="355" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">MessageGroupId = thread_id</text><polyline points="645,291 645,98" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="480" y="44" width="180" height="52" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="570.0" y="67.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">host: one if</text><text x="570.0" y="82.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">question_id in message → resume</text><text x="484" y="122" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280" font-style="italic">a timeout is the same shape:</text><text x="484" y="135" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280" font-style="italic">send envelope.default</text><text x="484" y="148" text-anchor="start" font-size="9.5" font-weight="normal" fill="#6B7280" font-style="italic">as the answer</text></svg>