<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="Left, the first deployed attempt: the schedule fires and sends with MessageGroupId only; the FIFO answers queue rejects a send with no MessageDeduplicationId; Scheduler still reports success and deletes the schedule; nothing entered the queue so the answers dead-letter queue never sees it; the agent never resumes and the evidence is gone. Right, the fix: content_based_deduplication=True on the answers queue, so the send is accepted and the agent resumes, plus a DeadLetterConfig on the schedule's target where a refused delivery would land; the run prints undelivered schedules: 0." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="170" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#DC2626">First attempt: FIFO without content-based dedup</text><text x="510" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E9C7C">The fix: one property, plus a place for evidence</text><line x1="340" y1="34" x2="340" y2="300" stroke="#E5E7EB"/><rect x="20" y="40" width="280" height="40" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="160.0" y="57.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">schedule fires at expires_at</text><text x="160.0" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">SendMessage: MessageGroupId only, no dedup id</text><polyline points="160,80 160,96" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><rect x="20" y="98" width="280" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="160.0" y="115.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">answers.fifo rejects the send</text><text x="160.0" y="130.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">dedup id required, or content-based dedup on</text><polyline points="160,138 160,166" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="168" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="160.0" y="190.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">Scheduler reports success · DELETE runs</text><text x="160" y="220" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#6B7280">the invocation was made, so the schedule reaps itself</text><rect x="20" y="232" width="280" height="42" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="160.0" y="250.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">nothing enters the queue</text><text x="160.0" y="265.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">so the answers DLQ can never see it</text><text x="160" y="292" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">agent never resumes · question waits for ever · evidence deleted</text><rect x="360" y="40" width="280" height="40" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="500.0" y="57.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">schedule fires at expires_at</text><text x="500.0" y="72.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">SendMessage: MessageGroupId only, no dedup id</text><polyline points="500,80 500,96" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><rect x="360" y="98" width="280" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="500.0" y="115.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">answers.fifo accepts it</text><text x="500.0" y="130.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">content_based_deduplication=True on the queue</text><text x="500" y="154" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#6B7280">explicit ids from other senders still take precedence</text><polyline points="500,138 500,166" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><rect x="360" y="168" width="280" height="36" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="500.0" y="190.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">agent resumes · rejects · refunds 0</text><rect x="360" y="222" width="280" height="52" rx="6" fill="#FFFFFF" stroke="#0E9C7C" stroke-width="1.5"/><text x="500.0" y="245.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">DeadLetterConfig on the schedule's target</text><text x="500.0" y="260.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">a standard queue; a refused delivery lands here</text><text x="500" y="292" text-anchor="middle" font-size="9" font-weight="bold" fill="#0E9C7C">undelivered schedules on the schedule dead-letter queue: 0</text><text x="340" y="318" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1F2937">A DLQ on the answers queue catches messages that arrived and failed; this send was refused before anything arrived.</text></svg>