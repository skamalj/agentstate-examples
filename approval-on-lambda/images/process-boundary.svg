<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="A wall separates what lives in the Lambda process and dies with it (the graph run, the interrupt value, InMemorySaver, a module-level list) from what lives in AWS and survives (the checkpoint table, the questions queue, the approvals table, the side-effect counter). DynamoDBSaver carries the parked thread across the wall in act 2; publish_interrupts carries the question across in act 3." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="330" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="170" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">In the process · dies with it</text><text x="510" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#0E9C7C">In AWS · survives the process</text><rect x="336" y="36" width="8" height="234" fill="#F3F4F6" stroke="#6B7280"/><text x="340" y="280" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280" font-style="italic">boundary</text><rect x="30" y="44" width="280" height="34" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="170.0" y="65.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1F2937">graph run · model call · tool call</text><rect x="30" y="86" width="280" height="34" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="170.0" y="107.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1F2937">the interrupt value  {function, args}</text><rect x="30" y="128" width="280" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="170.0" y="145.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">InMemorySaver  (act 1)</text><text x="170.0" y="160.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">checkpoints + pending writes, in a dict</text><rect x="30" y="176" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="170.0" y="193.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1F2937">REFUNDS_ISSUED  (a module-level list)</text><text x="170.0" y="208.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">proves nothing about a Lambda you are not inside</text><text x="170" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#DC2626">act 1: the process exits → all of this is gone.</text><text x="170" y="254" text-anchor="middle" font-size="10" font-weight="normal" fill="#DC2626">Resume finds an empty checkpoint and greets the customer.</text><text x="170" y="268" text-anchor="middle" font-size="10" font-weight="normal" fill="#DC2626">No error anywhere.</text><rect x="370" y="44" width="280" height="40" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="510.0" y="61.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">checkpoint table  (act 2)</text><text x="510.0" y="76.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">3 checkpoints + 5 pending writes, incl. __interrupt__</text><rect x="370" y="92" width="280" height="40" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="510.0" y="109.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">questions.fifo  (act 3)</text><text x="510.0" y="124.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">the envelope: question, deadline, reply_with</text><rect x="370" y="140" width="280" height="40" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="510.0" y="157.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">approvals table  (act 3)</text><text x="510.0" y="172.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">pk THREAD#… · sk WAIT#… · status = open</text><rect x="370" y="188" width="280" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="510.0" y="205.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">side-effect counter  (act 4)</text><text x="510.0" y="220.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">ADD calls :one · says 2 if the refund ever ran twice</text><polyline points="310,148 368,64" fill="none" stroke="#2F6FED" stroke-width="1.5" marker-end="url(#ab)"/><polyline points="310,103 368,112" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><polyline points="310,103 368,160" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><line x1="30" y1="292" x2="50" y2="292" stroke="#2F6FED" stroke-width="1.5"/><text x="56" y="296" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2F6FED">DynamoDBSaver carries the thread across (act 2)</text><line x1="370" y1="292" x2="390" y2="292" stroke="#F28C28" stroke-width="1.5"/><text x="396" y="296" text-anchor="start" font-size="9.5" font-weight="normal" fill="#F28C28">publish_interrupts carries the question across (act 3)</text><text x="510" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#0E9C7C">act 2 makes the thread a row, act 3 makes the question a message.</text><text x="510" y="264" text-anchor="middle" font-size="10" font-weight="normal" fill="#0E9C7C">Neither package keeps state of its own; there is nothing else to run.</text><text x="340" y="318" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">Act 1 fails on the left of the wall. Acts 2 and 3 move the two things that matter across it.</text></svg>