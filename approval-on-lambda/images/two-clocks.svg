<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="A three-day timeline from publish on Sep 24 at 18:19. The enforced clock, DynamoDB TTL, deletes the parked thread on Sep 25 at 18:19:37. The advisory clock, expires_at, tells finance the question is good until Sep 27 at 18:19:38. The two-day gap is shaded: an approval that arrives there resumes a thread that no longer exists, and no refund is recorded." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="340" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Two clocks on one parked thread: WaitPolicy(timeout='P3D') vs DynamoDBSaver(ttl_seconds=86400)</text><rect x="256.66666666666663" y="60" width="373.33333333333337" height="130" rx="0" fill="#FEE2E2" opacity="0.8"/><text x="443.3333333333333" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">the question outlives the thread by 2 days, 0:00:01</text><text x="443.3333333333333" y="134" text-anchor="middle" font-size="10" font-weight="normal" fill="#DC2626">an approval landing here resumes a thread that no longer exists:</text><text x="443.3333333333333" y="148" text-anchor="middle" font-size="10" font-weight="normal" fill="#DC2626">empty checkpoint · agent greets the customer · refunds recorded: 0</text><line x1="70" y1="190" x2="630" y2="190" stroke="#6B7280" stroke-width="1.5"/><line x1="70.0" y1="186" x2="70.0" y2="194" stroke="#6B7280"/><text x="70.0" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">Sep 24</text><line x1="256.7" y1="186" x2="256.7" y2="194" stroke="#6B7280"/><text x="256.66666666666663" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">Sep 25</text><line x1="443.3" y1="186" x2="443.3" y2="194" stroke="#6B7280"/><text x="443.3333333333333" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">Sep 26</text><line x1="630.0" y1="186" x2="630.0" y2="194" stroke="#6B7280"/><text x="630.0" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#6B7280">Sep 27</text><text x="70.0" y="222" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">18:19 published</text><line x1="256.7" y1="60" x2="256.7" y2="190" stroke="#DC2626" stroke-width="2"/><rect x="166.66666666666663" y="62" width="180" height="40" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="256.66666666666663" y="79.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">ttl · 2026-09-25T18:19:37Z</text><text x="256.66666666666663" y="94.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">AWS enforces: the thread is deleted</text><line x1="630.0" y1="60" x2="630.0" y2="190" stroke="#2F6FED" stroke-width="2" stroke-dasharray="6 4"/><rect x="500.0" y="62" width="140" height="40" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="570.0" y="79.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">expires_at · 09-27T18:19:38Z</text><text x="570.0" y="94.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">advisory: nobody enforces it</text><rect x="70.0" y="164" width="186.7" height="14" fill="#E4ECFD" stroke="#2F6FED"/><text x="163.33333333333331" y="175" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2F6FED">parked thread exists (8 items, each with ttl)</text><rect x="70.0" y="234" width="560.0" height="14" fill="#FDEBD9" stroke="#F28C28"/><text x="350.0" y="245" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#F28C28">question shows as open until the 27th (approvals table, questions queue, dashboard)</text><text x="340" y="272" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">expires_at is a published intention measured from publish time. ttl is a fact. If you set both, every expires_at</text><text x="340" y="286" text-anchor="middle" font-size="10" font-weight="normal" fill="#1F2937">has to fit inside the checkpoint TTL. Safe default: no ttl_seconds on a table holding threads parked on humans.</text></svg>