<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-label="The parked thread as eight DynamoDB items under one partition key: three checkpoints, one per super-step (384, 700 and 2172 bytes), each with its pending writes as child items. The last write, channel __interrupt__, 496 bytes, is the parked question itself." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="372" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="bold" fill="#1F2937">Query on PK = 'order-4471-a2d5f9f5'  →  8 items, one table, no GSIs</text><text x="20" y="40" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">SK is a checkpoint id, or &lt;checkpoint_id&gt;$&lt;task_id&gt;$&lt;index&gt; for a pending write of that checkpoint</text><rect x="20" y="56" width="640" height="88" rx="6" fill="none" stroke="#E5E7EB"/><rect x="30" y="62" width="250" height="24" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="155.0" y="78.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">checkpoint  SK=…fd5b…</text><text x="290" y="78" text-anchor="start" font-size="10" font-weight="normal" fill="#2F6FED">msgpack · 384 bytes</text><text x="650" y="78" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280" font-style="italic">super-step 1: the customer's message</text><path d="M45 86 L45 103 L58 103" fill="none" stroke="#6B7280" stroke-width="1"/><rect x="60" y="92" width="250" height="22" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="185.0" y="107.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1F2937">write  channel='messages'</text><text x="320" y="107" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">116 bytes</text><path d="M45 112 L45 129 L58 129" fill="none" stroke="#6B7280" stroke-width="1"/><rect x="60" y="118" width="250" height="22" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="185.0" y="133.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1F2937">write  channel='branch:to:model'</text><text x="320" y="133" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">0 bytes</text><rect x="20" y="152" width="640" height="88" rx="6" fill="none" stroke="#E5E7EB"/><rect x="30" y="158" width="250" height="24" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="155.0" y="174.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">checkpoint  SK=…fd6e…</text><text x="290" y="174" text-anchor="start" font-size="10" font-weight="normal" fill="#2F6FED">msgpack · 700 bytes</text><text x="650" y="174" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280" font-style="italic">super-step 2: the model calls escalate_refund</text><path d="M45 182 L45 199 L58 199" fill="none" stroke="#6B7280" stroke-width="1"/><rect x="60" y="188" width="250" height="22" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="185.0" y="203.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1F2937">write  channel='messages'</text><text x="320" y="203" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">1240 bytes</text><path d="M45 208 L45 225 L58 225" fill="none" stroke="#6B7280" stroke-width="1"/><rect x="60" y="214" width="250" height="22" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><text x="185.0" y="229.5" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1F2937">write  channel='__pregel_tasks'</text><text x="320" y="229" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">188 bytes</text><rect x="20" y="248" width="640" height="62" rx="6" fill="none" stroke="#E5E7EB"/><rect x="30" y="254" width="250" height="24" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="155.0" y="270.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">checkpoint  SK=…0bf9…</text><text x="290" y="270" text-anchor="start" font-size="10" font-weight="normal" fill="#2F6FED">msgpack · 2172 bytes</text><text x="650" y="270" text-anchor="end" font-size="10" font-weight="normal" fill="#6B7280" font-style="italic">super-step 3: the tool node parks</text><path d="M45 278 L45 295 L58 295" fill="none" stroke="#6B7280" stroke-width="1"/><rect x="60" y="284" width="250" height="22" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="185.0" y="299.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">write  channel='__interrupt__'</text><text x="320" y="299" text-anchor="start" font-size="10" font-weight="bold" fill="#F28C28">496 bytes</text><text x="650" y="299" text-anchor="end" font-size="10.5" font-weight="bold" fill="#F28C28">← this item IS the parked question</text><text x="20" y="332" text-anchor="start" font-size="10" font-weight="normal" fill="#1F2937">On resume the package loads the five writes back into CheckpointTuple.pending_writes (ConsistentRead).</text><text x="20" y="346" text-anchor="start" font-size="10" font-weight="normal" fill="#1F2937">A checkpointer that wrote only checkpoints would re-run the node from a state that does not know it ever asked.</text><text x="20" y="362" text-anchor="start" font-size="10" font-weight="normal" fill="#6B7280">After the resume: 14 items (was 8).</text></svg>