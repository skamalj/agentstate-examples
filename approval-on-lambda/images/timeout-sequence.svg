<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img" aria-label="The deadline end to end on thread order-5ed76d: the start invocation parks and publishes the same envelope to questions.fifo and timeouts.fifo. The scheduler Lambda creates a one-shot schedule named refund-timeout-95e310aa4663f0ec685aa157 with at(2026-09-25T05:39:55), ActionAfterCompletion DELETE, targeting answers.fifo with MessageGroupId order-5ed76d and the envelope's default as the answer. For 211 s no process runs. At expires_at 2026-09-25T05:39:55Z nothing fires; at 05:40:13Z, 18 s later, the schedule delivers the default and deletes itself, the agent resumes and rejects, refunds recorded 0. A late human approval is a no-op, refunds still 0." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F28C28"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9C7C"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F6FED"/></marker></defs><rect width="680" height="452" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><line x1="20" y1="40" x2="660" y2="40" stroke="#E5E7EB"/><line x1="20" y1="122" x2="660" y2="122" stroke="#E5E7EB"/><line x1="20" y1="200" x2="660" y2="200" stroke="#E5E7EB"/><line x1="20" y1="330" x2="660" y2="330" stroke="#E5E7EB"/><rect x="292" y="40" width="208" height="332" fill="#F3F4F6" opacity="0.6"/><rect x="100" y="50" width="130" height="48" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="165.0" y="71.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F2937">invocation · start</text><text x="165.0" y="86.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">parks · publishes</text><polyline points="140,98 140,130" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><polyline points="235,98 235,130" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="240" y="118" text-anchor="start" font-size="8.5" font-weight="normal" fill="#F28C28">same envelope, twice</text><rect x="100" y="132" width="80" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="140.0" y="149.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">questions</text><text x="140.0" y="164.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">a person</text><rect x="190" y="132" width="90" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="235.0" y="149.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">timeouts</text><text x="235.0" y="164.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">a scheduler</text><polyline points="235,172 235,210" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><rect x="190" y="212" width="90" height="36" rx="6" fill="#FDEBD9" stroke="#F28C28" stroke-width="1.5"/><text x="235.0" y="227.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">scheduler</text><text x="235.0" y="242.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">create_schedule</text><polyline points="280,230 298,230" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><rect x="296" y="206" width="204" height="108" rx="6" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.5"/><text x="398" y="220" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#F28C28">one-shot schedule: a row, not a process</text><text x="302" y="236" text-anchor="start" font-size="8.5" font-weight="normal" fill="#1F2937">refund-timeout-95e310aa4663f0ec685aa157</text><text x="302" y="250" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">at(2026-09-25T05:39:55)  UTC</text><text x="302" y="264" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">ActionAfterCompletion = DELETE</text><text x="302" y="278" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">target answers.fifo</text><text x="302" y="292" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">MessageGroupId = order-5ed76d</text><text x="302" y="306" text-anchor="start" font-size="9" font-weight="normal" fill="#1F2937">Input = reply_with, answer = default</text><text x="398" y="326" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6B7280">211 s · no process of ours is running</text><line x1="505" y1="40" x2="505" y2="372" stroke="#DC2626" stroke-dasharray="5 4"/><polyline points="500,252 560,252 560,174" fill="none" stroke="#F28C28" stroke-width="1.5" marker-end="url(#ao)"/><text x="566" y="262" text-anchor="start" font-size="8.5" font-weight="bold" fill="#F28C28">fires 05:40:13Z (+18 s)</text><text x="566" y="274" text-anchor="start" font-size="8.5" font-weight="normal" fill="#F28C28">sends the default,</text><text x="566" y="286" text-anchor="start" font-size="8.5" font-weight="normal" fill="#F28C28">deletes itself</text><rect x="510" y="132" width="100" height="40" rx="6" fill="#DBF2EB" stroke="#0E9C7C" stroke-width="1.5"/><text x="560.0" y="149.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">answers</text><text x="560.0" y="164.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">answer = reject</text><polyline points="560,132 560,100" fill="none" stroke="#0E9C7C" stroke-width="1.5" marker-end="url(#ag)"/><rect x="505" y="50" width="112" height="48" rx="6" fill="#E4ECFD" stroke="#2F6FED" stroke-width="1.5"/><text x="561.0" y="71.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">invocation · answer</text><text x="561.0" y="86.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6B7280">rejected · refunds 0</text><text x="560" y="186" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2F6FED">the customer is told, not silenced</text><rect x="598" y="340" width="72" height="28" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="634.0" y="358.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F2937">approves, late</text><polyline points="668,340 668,100" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="623" y="50" width="48" height="48" rx="6" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/><text x="647" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">no-op</text><text x="647" y="84" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#6B7280">refunds 0</text><text x="622" y="110" text-anchor="start" font-size="8.5" font-weight="normal" fill="#2F6FED">same as a</text><text x="622" y="120" text-anchor="start" font-size="8.5" font-weight="normal" fill="#2F6FED">duplicate</text><text x="22" y="54" text-anchor="start" font-size="9" font-weight="bold" fill="#2F6FED">run Lambda</text><text x="22" y="136" text-anchor="start" font-size="9" font-weight="bold" fill="#0E9C7C">SQS (FIFO)</text><text x="22" y="214" text-anchor="start" font-size="9" font-weight="bold" fill="#F28C28">scheduler Lambda</text><text x="22" y="344" text-anchor="start" font-size="9" font-weight="bold" fill="#7C3AED">finance</text><text x="22" y="228" text-anchor="start" font-size="8" font-weight="normal" fill="#F28C28">+ EventBridge</text><text x="22" y="238" text-anchor="start" font-size="8" font-weight="normal" fill="#F28C28">Scheduler</text><line x1="20" y1="372" x2="660" y2="372" stroke="#6B7280"/><text x="165" y="387" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">05:37:55 published</text><text x="505" y="387" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">expires_at 2026-09-25T05:39:55Z</text><text x="560" y="400" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">05:40:13Z resumed</text><text x="646" y="387" text-anchor="middle" font-size="9" font-weight="normal" fill="#6B7280">later</text><text x="340" y="426" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1F2937">18 s late is delivery, not drift: EventBridge Scheduler is minute-granular. The late approval runs nothing</text><text x="340" y="440" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1F2937">for the same reason a duplicate does: the thread has already moved past the question. No guard was installed.</text></svg>